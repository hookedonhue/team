<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoH Team — Data Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .wrap { max-width: 800px; margin: 0 auto; padding: 52px 24px 80px; }
  .masthead { text-align: center; margin-bottom: 44px; animation: fadeUp .6s ease both; }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--orange); margin-bottom: 10px; }
  .pg-title { font-family: 'Playfair Display', serif; font-size: clamp(26px,4vw,40px); font-weight: 400; color: var(--ink); margin-bottom: 6px; }
  .pg-title em { font-style: italic; color: var(--orange); }
  .pg-sub { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-style: italic; color: var(--ink-light); }

  /* Flow block */
  .flow-block { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 26px 28px; margin-bottom: 16px; animation: fadeUp .6s ease both; box-shadow: var(--shadow-xs); }
  .flow-block:nth-child(1){animation-delay:.1s;}
  .flow-block:nth-child(2){animation-delay:.18s;}
  .flow-block:nth-child(3){animation-delay:.26s;}

  .fhdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .ftitle { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
  .fsub { font-family: 'Cormorant Garamond', serif; font-size: 14px; font-style: italic; color: var(--ink-light); }

  .play-btn { background: var(--ink); color: var(--white); border: none; border-radius: 20px; padding: 7px 18px; font-size: 11px; font-weight: 500; letter-spacing: .06em; cursor: pointer; transition: all .18s ease; white-space: nowrap; }
  .play-btn:hover { background: var(--orange); }
  .play-btn.replay { background: var(--orange-light); color: var(--orange); border: 1px solid var(--orange-mid); }

  /* Steps */
  .step { display: flex; gap: 13px; padding: 11px 0; opacity: .22; transition: opacity .32s ease; }
  .step.active { opacity: 1; }
  .step.done { opacity: .55; }

  .step-num-col { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .snum { width: 25px; height: 25px; border-radius: 50%; background: var(--light-gray); border: 1.5px solid var(--border-mid); display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 600; color: var(--ink-light); transition: all .28s ease; }
  .step.active .snum { background: var(--orange); border-color: var(--orange); color: #fff; }
  .step.done .snum { background: var(--ink); border-color: var(--ink); color: #fff; }
  .svline { flex: 1; width: 1.5px; background: var(--border); margin: 3px 0; min-height: 14px; }
  .step:last-child .svline { display: none; }

  .scontent { flex: 1; padding-bottom: 5px; }
  .sagent { font-size: 12.5px; font-weight: 500; color: var(--ink); margin-bottom: 2px; }
  .saction { font-family: 'Cormorant Garamond', serif; font-size: 14px; color: var(--ink-light); margin-bottom: 6px; line-height: 1.5; }

  .sout { background: var(--orange-light); border-left: 2px solid var(--orange); padding: 7px 11px; border-radius: 0 var(--r) var(--r) 0; display: none; animation: slideIn .28s ease; }
  .step.active .sout, .step.done .sout { display: block; }
  .sout-lbl { font-size: 8.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--orange); opacity: .85; margin-bottom: 3px; }
  .sout-txt { font-family: 'Cormorant Garamond', serif; font-size: 13.5px; color: var(--ink-mid); line-height: 1.5; }

  .flow-done { text-align: center; padding: 13px; background: var(--orange-light); border-radius: var(--r); margin-top: 10px; display: none; }
  .flow-done.vis { display: block; }
  .flow-done p { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-style: italic; color: var(--orange); }
</style>
</head>
<body>
<nav>
  <a class="nav-brand" href="index.html">Hooked on Hue</a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Org Map</a>
    <a class="nav-link" href="ecosystem.html">Ecosystem</a>
    <a class="nav-link" href="third-shift.html">Third Shift</a>
    <div class="nav-dropdown">
      <button class="nav-link active dropdown-toggle">Archive ▾</button>
      <div class="dropdown-menu">
        <a href="roster.html">Full Roster</a>
        <a href="data-flow.html" style="color:var(--orange);">Data Flow</a>
      </div>
    </div>
  </div>
  <div class="nav-live"><span class="live-dot"></span>Live</div>
</nav>
<div class="page"><div class="wrap">
  <div class="masthead">
    <div class="eyebrow">Archive · Data Flow</div>
    <h1 class="pg-title">How the Team <em>Actually Works</em></h1>
    <p class="pg-sub">Watch how a single input moves through the full AI team — step by step.</p>
  </div>
  <div id="flowContainer"></div>
</div></div>
<footer>
  <span class="footer-brand">Hooked on Hue</span>
  <span class="footer-tagline">Data Flow · Archive</span>
</footer>
<script src="data.js"></script>
<script>
const states={};
function render(){
  const container=document.getElementById('flowContainer');
  HOH.dataFlows.forEach(flow=>{
    states[flow.id]={step:-1,interval:null,playing:false};
    const block=document.createElement('div');block.className='flow-block';
    block.innerHTML=`
      <div class="fhdr">
        <div><div class="ftitle">${flow.title}</div><div class="fsub">${flow.subtitle}</div></div>
        <button class="play-btn" id="btn-${flow.id}" onclick="tog('${flow.id}')">▶ Play</button>
      </div>
      <div id="steps-${flow.id}">
        ${flow.steps.map((s,si)=>`
          <div class="step" id="step-${flow.id}-${si}">
            <div class="step-num-col">
              <div class="snum">${si+1}</div>
              ${si<flow.steps.length-1?'<div class="svline"></div>':''}
            </div>
            <div class="scontent">
              <div class="sagent">${s.agent}</div>
              <div class="saction">${s.action}</div>
              <div class="sout"><div class="sout-lbl">→ Output</div><div class="sout-txt">${s.output}</div></div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="flow-done" id="done-${flow.id}"><p>Flow complete — the team handled it.</p></div>
    `;
    container.appendChild(block);
  });
}
function tog(id){
  const s=states[id];const flow=HOH.dataFlows.find(f=>f.id===id);
  if(s.playing){pause(id);return;}
  if(s.step>=flow.steps.length-1){rst(id);}
  play(id);
}
function play(id){
  const s=states[id];const flow=HOH.dataFlows.find(f=>f.id===id);
  s.playing=true;const btn=document.getElementById(`btn-${id}`);
  btn.textContent='⏸ Pause';btn.classList.remove('replay');
  function adv(){
    s.step++;
    if(s.step>=flow.steps.length){pause(id);btn.textContent='↩ Replay';btn.classList.add('replay');document.getElementById(`done-${id}`).classList.add('vis');return;}
    if(s.step>0){document.getElementById(`step-${id}-${s.step-1}`).classList.replace('active','done');}
    document.getElementById(`step-${id}-${s.step}`).classList.add('active');
  }
  adv();s.interval=setInterval(adv,1800);
}
function pause(id){
  const s=states[id];s.playing=false;clearInterval(s.interval);
  const btn=document.getElementById(`btn-${id}`);
  if(!btn.textContent.includes('Replay')){btn.textContent='▶ Play';btn.classList.remove('replay');}
}
function rst(id){
  const s=states[id];s.step=-1;
  HOH.dataFlows.find(f=>f.id===id).steps.forEach((_,si)=>{
    const el=document.getElementById(`step-${id}-${si}`);
    el.classList.remove('active','done');
  });
  document.getElementById(`done-${id}`).classList.remove('vis');
  document.getElementById(`btn-${id}`).textContent='▶ Play';
  document.getElementById(`btn-${id}`).classList.remove('replay');
}
render();
</script>
</body>
</html>
